<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cancelar o reprogramar cita | Hair Salon Reset</title>
  <script src="assets/client-actions-config.js?v=20260817-reset1"></script>
  <style>
    :root{--ink:#25291f;--muted:#6f7466;--line:#e2ddc7;--paper:#f3f1e4;--panel:#fffdf5;--plum:#42513a;--rose:#b8862d;--gold:#b79045;--danger:#9b4743;--radius:16px;--shadow:0 20px 52px rgba(37,41,31,.14)}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#fffdf5,#e7e9dc);color:var(--ink);min-height:100vh;padding:18px}.card{width:min(920px,100%);margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}.hero{padding:24px;color:#fff;background:linear-gradient(135deg,var(--plum),#718064 72%,var(--gold))}.hero-brand{display:flex;align-items:center;gap:14px}.hero-brand img{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.65)}.hero h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(30px,5vw,48px)}.hero p{margin:8px 0 0;color:rgba(255,255,255,.88);line-height:1.55}.content{padding:22px}.muted{color:var(--muted);line-height:1.55}.box,.alert{border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:14px 0;background:#fffdf5}.alert{background:#faf6e8}.alert.danger{color:var(--danger);background:rgba(155,71,67,.1)}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.summary div{border:1px solid var(--line);border-radius:var(--radius);padding:12px;background:#fff}.summary span{display:block;color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase}.summary strong{display:block;margin-top:6px;color:var(--plum)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}label{display:block;font-weight:800;color:var(--muted);margin:10px 0 6px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:var(--radius);padding:12px;font:inherit;background:#fff;color:var(--ink)}textarea{min-height:90px;resize:vertical}button{border:0;border-radius:999px;background:var(--plum);color:#fff;font-weight:900;padding:12px 16px;cursor:pointer}button.secondary{background:#fff;color:var(--plum);border:1px solid var(--line)}button.danger{background:var(--danger)}button:disabled{opacity:.55;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(140%);max-width:min(560px,calc(100% - 24px));background:var(--plum);color:#fff;border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);transition:.2s}.toast.show{transform:translateX(-50%) translateY(0)}@media(max-width:760px){.grid{grid-template-columns:1fr}.content{padding:16px}.hero-brand{align-items:flex-start}}
  </style>
</head>
<body>
  <main class="card">
    <section class="hero">
      <div class="hero-brand"><img src="assets/hair-salon-reset-logo.jpeg" alt="Hair Salon Reset"><div><h1>Cancelar o reprogramar cita</h1>
      <p>Hair Salon Reset By Yaleixi · Revisa la política de 24 horas antes de enviar tu solicitud.</p></div></div>
    </section>
    <section class="content" id="app">
      <div class="box">Cargando información de la cita...</div>
    </section>
  </main>
  <div class="toast" id="toast"></div>
  <script>
    const $=s=>document.querySelector(s);
    const CONFIG=Object.assign({apiBaseUrl:'/api/compat'}, window.DHS_CLIENT_ACTIONS_CONFIG||{});
    const state={id:'', token:'', appointment:null};
    document.addEventListener('DOMContentLoaded', init);
    function init(){const params=new URLSearchParams(location.search||'');state.id=params.get('id')||'';state.token=params.get('token')||'';if(!state.id||!state.token){renderError('Este enlace no contiene una cita válida. Comunícate directamente con el salón.');return;} if(!CONFIG.apiBaseUrl||CONFIG.apiBaseUrl.indexOf('REPLACE_WITH_')!==-1){renderError('Falta configurar Client Actions API. Revisa assets/client-actions-config.js.');return;} loadAppointment();}
    async function loadAppointment(){try{setLoading('Cargando información de la cita...');state.appointment=await gas('getAppointmentManageData',{id:state.id,token:state.token});renderAppointment(state.appointment);}catch(e){renderError(e.message||String(e));}}
    function renderAppointment(data){$('#app').innerHTML=`
      <div class="summary">
        <div><span>ID</span><strong>${escapeHtml(data.id||'')}</strong></div>
        <div><span>Clienta</span><strong>${escapeHtml(data.clientName||'')}</strong></div>
        <div><span>Servicio</span><strong>${escapeHtml(data.service||'')}</strong></div>
        <div><span>Fecha</span><strong>${escapeHtml(data.date||'')} ${escapeHtml(formatTime12(data.time||''))}</strong></div>
        <div><span>Estado</span><strong>${escapeHtml(data.status||'')}</strong></div>
      </div>
      <div class="alert"><strong>Política de 24 horas</strong><p>${escapeHtml(data.feeMessage||data.policy||'')}</p><p>Fee estimado de cancelación: ${escapeHtml(data.cancelFee||'')}<br>Fee estimado de reprogramación: ${escapeHtml(data.rescheduleFee||'')}</p></div>
      <div class="grid">
        <form id="cancelForm" class="box"><h2>Cancelar cita</h2><p class="muted">Envía una solicitud de cancelación. El salón revisará si aplica algún cargo según la política aceptada.</p><button class="danger" type="submit">Solicitar cancelación</button></form>
        <form id="rescheduleForm" class="box"><h2>Reprogramar cita</h2><label>Nueva fecha solicitada<input id="newDate" type="date" required></label><label>Nueva hora solicitada<select id="newTime" required aria-label="Nueva hora en formato de 12 horas"></select></label><label>Motivo o nota<textarea id="reason" placeholder="Opcional"></textarea></label><button type="submit">Solicitar reprogramación</button></form>
      </div>
      <p class="muted">La reprogramación no queda confirmada hasta que el salón la apruebe.</p>`;
      $('#newTime').innerHTML=timeOptionsHtml();
      $('#cancelForm').addEventListener('submit', e=>{e.preventDefault();submitRequest({action:'cancel'});});
      $('#rescheduleForm').addEventListener('submit', e=>{e.preventDefault();submitRequest({action:'reschedule',newDate:$('#newDate').value,newTime:$('#newTime').value,reason:$('#reason').value});});}
    async function submitRequest(payload){try{setLoading('Enviando solicitud...');const result=await gas('submitAppointmentManageRequest',Object.assign({id:state.id,token:state.token},payload));$('#app').innerHTML=`<div class="alert"><strong>${escapeHtml(result.title||'Solicitud recibida')}</strong><p>${escapeHtml(result.message||'')}</p></div><div class="box"><strong>Política</strong><p>${escapeHtml(result.feeMessage||'')}</p></div><div class="actions"><button class="secondary" type="button" onclick="location.href='./'">Volver a la página</button></div>`;toast('Solicitud recibida.');}catch(e){renderError(e.message||String(e));}}
    function setLoading(text){$('#app').innerHTML=`<div class="box">${escapeHtml(text)}</div>`}
    function renderError(message){$('#app').innerHTML=`<div class="alert danger"><strong>No se pudo abrir la cita</strong><p>${escapeHtml(message)}</p></div><p class="muted">Comunícate directamente con el salón si necesitas ayuda.</p>`}
    async function gas(fn,arg){const endpoint=String(CONFIG.apiBaseUrl||'/api/compat').trim();if(!endpoint)throw new Error('Falta configurar la conexión con el sistema.');const abortController=typeof AbortController!=='undefined'?new AbortController():null;const timer=setTimeout(()=>{if(abortController)abortController.abort()},20000);try{const response=await fetch(endpoint,{method:'POST',cache:'no-store',headers:{'content-type':'application/json',accept:'application/json'},body:JSON.stringify({requestId:'client_'+Date.now()+'_'+Math.random().toString(16).slice(2),functionName:fn,args:[arg]}),signal:abortController?abortController.signal:undefined});const envelope=await response.json().catch(()=>null);if(!response.ok||!envelope||envelope.ok!==true)throw new Error(envelope&&envelope.error?envelope.error:'No se pudo completar la solicitud.');return envelope.data}catch(error){if(error&&error.name==='AbortError')throw new Error('La conexión tardó demasiado. Intenta nuevamente.');throw error}finally{clearTimeout(timer)}}
    function add(form,name,value){const input=document.createElement('input');input.type='hidden';input.name=name;input.value=value;form.appendChild(input)}
    function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),3200)}
    function formatTime12(value){const raw=String(value||'').trim().toUpperCase();const match=raw.match(/^(\d{1,2}):(\d{2})(?:\s*([AP]M))?$/);if(!match)return raw;let hour=Number(match[1]);const minute=Number(match[2]);if(match[3]){if(match[3]==='AM')hour=hour===12?0:hour;else hour=hour===12?12:hour+12}return `${hour%12||12}:${String(minute).padStart(2,'0')} ${hour<12?'AM':'PM'}`}
    function timeOptionsHtml(){let html='<option value="">Selecciona una hora</option>';for(let minute=0;minute<24*60;minute+=15){const value=`${String(Math.floor(minute/60)).padStart(2,'0')}:${String(minute%60).padStart(2,'0')}`;html+=`<option value="${value}">${formatTime12(value)}</option>`}return html}
    function escapeHtml(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  </script>
</body>
</html>
